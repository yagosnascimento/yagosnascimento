name: Execução Automática ETL Jira para TOTVS Carol

on:
  schedule:
    # Executa todos os dias às 06:00 AM UTC (03:00 AM Horário de Brasília)
    - cron: '0 6 * * *'
  # Permite acionar manualmente a qualquer momento pelo botão "Run workflow" no GitHub
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar ETL Jira -> Carol
        run: |
          python main.py
